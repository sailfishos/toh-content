--- # Kaamos Black TOH
override:
  ambience: file:///usr/share/ambience/kaamos-black/kaamos-black.ambience

user-unit:
  description: Set Kaamos Black Ambience
  type: transient-service
  service-type: oneshot
  service-name: set-ambience-to-kaamos-black
  service-exec:
    - "/usr/libexec/change_ambience.sh"
    - "file:///usr/share/ambience/kaamos-black/kaamos-black.ambience"
  run-on-start: false
